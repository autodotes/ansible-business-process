# ansible-navigator run playbooks/pb_gmail_tasks_report.yml
# ansible-navigator run playbooks/pb_gmail_tasks_report.yml -e 'gmail_label="RHSC/Tasks Report"'
---
- name: Read latest email by Gmail label
  hosts: localhost
  vars:
    gmail_label: My Label
  gather_facts: false
  tasks:
    - name: Search Gmail for the latest email with label | {{ gmail_label }}
      zjleblanc.gsuite.gmail_search:
        labels:
          - "{{ gmail_label }}"
        max_results: 1
        message_format: full
      failed_when: gmail_label_search.messages | default([]) | length == 0
      register: gmail_label_search

    - name: Show the latest email with label | {{ gmail_label }}
      ansible.builtin.copy:
        content: "{{ gmail_label_search.messages[0].body }}"
        dest: .artifacts/email_report_body.raw.txt
        mode: "0644"

    - name: Show the parsed report data
      ansible.builtin.copy:
        content: "{{ gmail_label_search.messages[0].body | zjleblanc.gsuite.parse_sf_tasks | to_nice_json(indent=2) }}"
        dest: .artifacts/report.parsed.json
        mode: "0644"
