# ansible-navigator run playbooks/pb_track_support_cases.yml -e @vault.yml -e @vars/accounts.yml
---
- name: Track Red Hat support cases and notify on changes
  hosts: localhost
  gather_facts: false

  vars_files:
    - vars/track_support_cases.yml

  tasks:
    - name: Assert required variables are provided
      ansible.builtin.assert:
        that:
          - redhat_offline_token is defined # offline token from https://access.redhat.com/management/api
          - redhat_offline_token | length > 0
          - gsheet_id is defined # Google Sheet ID
          - gsheet_id | length > 0
          - email_smtp_server is defined # SMTP host
          - email_smtp_server | length > 0
          - email_smtp_from_address is defined
          - email_smtp_from_address | length > 0
          - >-
            (tracker_notifications is defined and tracker_notifications | length > 0)
            or (tracker_email_to is defined and tracker_email_to | length > 0)
        fail_msg: >-
          Required extra vars missing: redhat_offline_token, gsheet_id, email_smtp_server,
          email_smtp_from_address, and either tracker_notifications or tracker_email_to.
          Provide them via -e @vault.yml or other extra vars.
        quiet: true

    - name: Build account list from legacy single-account variables
      when: support_case_accounts is not defined
      ansible.builtin.set_fact:
        support_case_accounts:
          - name: "{{ support_case_account_name }}"
            ids: "{{ support_case_account_ids }}"

    - name: Validate account configuration
      ansible.builtin.assert:
        that:
          - support_case_accounts is defined
          - support_case_accounts | length > 0
          - support_case_accounts | map(attribute='name') | list | length == support_case_accounts | length
          - support_case_accounts | map(attribute='ids') | list | length == support_case_accounts | length
        fail_msg: >-
          No accounts configured. Provide support_case_accounts (list of name/ids dicts) or
          support_case_account_name + support_case_account_ids for a single account.
        success_msg: "Tracking {{ support_case_accounts | length }} account configuration(s)"

    - name: Normalize notification pairings from legacy tracker_email_to
      when: tracker_notifications is not defined
      ansible.builtin.assert:
        that:
          - tracker_email_to is defined
          - tracker_email_to is sequence
          - tracker_email_to is not string
          - tracker_email_to | length > 0
        fail_msg: >-
          tracker_email_to must be a non-empty list when tracker_notifications is omitted.
        quiet: true

    - name: Build notification pairings from legacy tracker_email_to
      when: tracker_notifications is not defined
      ansible.builtin.set_fact:
        tracker_notifications:
          - to: "{{ tracker_email_to }}"
            accounts: all

    - name: Validate notification pairings list
      ansible.builtin.assert:
        that:
          - tracker_notifications is defined
          - tracker_notifications is sequence
          - tracker_notifications is not string
          - tracker_notifications | length > 0
        fail_msg: >-
          Provide tracker_notifications (non-empty list of to/accounts pairings) or
          tracker_email_to (non-empty list) for a single all-accounts notification.
        success_msg: "Configured {{ tracker_notifications | length }} notification pairing(s)"

    - name: Validate each notification pairing
      vars:
        _to: "{{ notification.to | default([]) }}"
        _accounts: "{{ notification.accounts | default('') }}"
        _pull_names: "{{ support_case_accounts | map(attribute='name') | list }}"
        _unknown: >-
          {{
            [] if (_accounts == 'all')
            else (
              (_accounts | difference(_pull_names))
              if (_accounts is sequence and _accounts is not string)
              else ['<accounts must be all or a list>']
            )
          }}
      ansible.builtin.assert:
        that:
          - _to is sequence
          - _to is not string
          - _to | length > 0
          - >-
            (_accounts == 'all')
            or (_accounts is sequence and _accounts is not string and (_accounts | length > 0))
          - _unknown | length == 0
        fail_msg: >-
          Invalid tracker_notifications pairing {{ notification }}:
          'to' must be a non-empty list;
          'accounts' must be 'all' or a non-empty list of names from support_case_accounts;
          unknown or invalid account names: {{ _unknown }}.
      loop: "{{ tracker_notifications }}"
      loop_control:
        loop_var: notification
        label: "{{ notification.to | default(['?']) | join(',') }}"

    - name: Exchange offline token for access token via Red Hat SSO
      ansible.builtin.uri:
        url: "{{ redhat_sso_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: refresh_token
          client_id: rhsm-api
          refresh_token: "{{ redhat_offline_token }}"
        status_code: 200
        timeout: 30
      register: r_sso_token
      no_log: "{{ secure_logging }}"

    - name: Set access token from SSO response
      ansible.builtin.set_fact:
        redhat_access_token: "{{ r_sso_token.json.access_token }}"
      no_log: "{{ secure_logging }}"

    - name: Read previous tracker state once for every tracked account
      zjleblanc.rh_case_mgmt.gsheet_tracker:
        state: read
        gsheet_id: "{{ gsheet_id | default(omit) }}"
        credentials_path: "{{ google_credentials_path | default(omit) }}"
        credentials: "{{ google_credentials | default(omit) }}"
        sheet: "{{ gsheet_sheet }}"
        account_names: "{{ support_case_accounts | map(attribute='name') | list }}"
      register: r_tracker_read

    - name: Track each account configuration
      ansible.builtin.include_tasks: ../tasks/account_track.yml
      loop: "{{ support_case_accounts }}"
      loop_control:
        loop_var: account
        label: "{{ account.name }}"

    - name: Build the full row matrix for this run
      ansible.builtin.set_fact:
        tracker_final_rows: "{{ r_tracker_read.other_rows + tracker_pending_rows }}"

    - name: Write tracker state once for the whole run
      zjleblanc.rh_case_mgmt.gsheet_tracker:
        state: write
        gsheet_id: "{{ gsheet_id | default(omit) }}"
        credentials_path: "{{ google_credentials_path | default(omit) }}"
        credentials: "{{ google_credentials | default(omit) }}"
        sheet: "{{ gsheet_sheet }}"
        table_name: "{{ gsheet_table_name }}"
        rows: "{{ tracker_final_rows }}"
      register: r_tracker_write

    - name: Send change notification email
      vars:
        notification_results: >-
          {{
            tracking_results
            if (notification.accounts == 'all')
            else (tracking_results | selectattr('account', 'in', notification.accounts) | list)
          }}
      when: >-
        tracker_notify_on_no_changes
        or (
          (
            tracking_results
            if (notification.accounts == 'all')
            else (tracking_results | selectattr('account', 'in', notification.accounts) | list)
          ) | selectattr('has_changes') | list | length > 0
        )
      community.general.mail:
        host: "{{ email_smtp_server }}"
        port: "{{ email_smtp_server_port | default(omit) }}"
        username: "{{ email_smtp_username | default(omit) }}"
        password: "{{ email_smtp_password | default(omit) }}"
        secure: "{{ tracker_smtp_secure | default(omit) }}"
        from: "{{ email_smtp_from_address }}"
        to: "{{ notification.to }}"
        subject: >-
          {{ tracker_email_subject }}{{
            ''
            if (
              (
                tracking_results
                if (notification.accounts == 'all')
                else (tracking_results | selectattr('account', 'in', notification.accounts) | list)
              ) | selectattr('has_changes') | list | length > 0
            )
            else ' (no changes)'
          }}
        subtype: html
        body: "{{ lookup('template', '../templates/support_case_tracking_email.html.j2') }}"
      loop: "{{ tracker_notifications }}"
      loop_control:
        loop_var: notification
        label: "{{ notification.to | join(',') }}"
      register: r_tracker_notifications
      no_log: "{{ secure_logging }}"

    - name: Display tracking run summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "Support Case Tracking Run Complete!"
          - "============================================"
          - "Accounts Tracked: {{ tracking_results | length }}"
          - "Accounts With Changes: {{ tracking_results | selectattr('has_changes') | list | length }}"
          - >-
            Notifications Sent:
            {{ r_tracker_notifications.results | json_query('[?!skipped]') | length }}
            /
            {{ tracker_notifications | length }}
          - "============================================"
