name: Publish collections

permissions:
  contents: write

concurrency:
  group: publish-collections
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - "collections/ansible_collections/zjleblanc/gsuite/**"
      - "collections/ansible_collections/zjleblanc/rh_case_mgmt/**"
  workflow_dispatch:
    inputs:
      collection:
        description: Which collection(s) to publish
        required: true
        default: both
        type: choice
        options:
          - both
          - gsuite
          - rh_case_mgmt
    secrets:
      MY_GALAXY_TOKEN:
        description: API token for public Ansible Galaxy
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Prepare Galaxy ansible.cfg
        run: |
          cp ansible.cfg.publish "$RUNNER_TEMP/ansible.cfg"
          sed -i "s/my_galaxy_token/$MY_GALAXY_TOKEN/1" "$RUNNER_TEMP/ansible.cfg"
        env:
          MY_GALAXY_TOKEN: ${{ secrets.MY_GALAXY_TOKEN }}

      - name: Publish selected collections
        env:
          ANSIBLE_CONFIG: ${{ runner.temp }}/ansible.cfg
          COLLECTION_CHOICE: ${{ github.event.inputs.collection || 'both' }}
        shell: bash
        run: |
          set -euo pipefail

          should_publish() {
            local target="$1"
            [ "${COLLECTION_CHOICE}" = "both" ] || [ "${COLLECTION_CHOICE}" = "${target}" ]
          }

          publish_one() {
            local choice="$1"
            local suffix="$2"
            local name="$3"
            local path="$4"
            local artifact_prefix="$5"
            local result_file="${RUNNER_TEMP}/publish-${suffix}.env"

            if ! should_publish "${choice}"; then
              echo "Not selected for this run: ${name}"
              return 0
            fi

            echo "::group::${name}"
            ./.github/scripts/increment-tag.sh "${suffix}" "${path}" "${result_file}"

            # shellcheck source=/dev/null
            source "${result_file}"
            if [ "${action}" = "skip" ]; then
              echo "Skipping ${name}"
              echo "::endgroup::"
              return 0
            fi

            echo "Publishing ${name} version ${version}"
            (
              cd "${path}"
              sed -i "s/0.0.0-semantic-version/${version}/1" galaxy.yml
              ansible-galaxy collection build .
              ansible-galaxy collection publish "${artifact_prefix}-${version}.tar.gz" -s galaxy
            )
            echo "::endgroup::"
          }

          publish_one gsuite gsuite zjleblanc.gsuite \
            collections/ansible_collections/zjleblanc/gsuite \
            zjleblanc-gsuite

          publish_one rh_case_mgmt rh-case-mgmt zjleblanc.rh_case_mgmt \
            collections/ansible_collections/zjleblanc/rh_case_mgmt \
            zjleblanc-rh_case_mgmt
